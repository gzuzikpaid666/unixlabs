events {}

http {
    # Docker DNS: имя "api" возвращает IP всех реплик
    resolver 127.0.0.11 valid=2s;

    server {
        listen 80;

        location / {
            # переменная заставляет nginx пере-резолвить имя по TTL,
            # поэтому новые реплики подхватываются без перезапуска
            set $upstream http://api:8000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
