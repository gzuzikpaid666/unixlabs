services:
  nginx:                      # входная точка и балансировщик
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:                        # управляющий контейнер (реплицируемый)
    build: ./api
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    deploy:
      replicas: 2
    restart: unless-stopped

  worker:                     # контейнеры-работники (реплицируемые)
    build: ./worker
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    stop_grace_period: 30s    # время на штатное завершение после SIGTERM
    deploy:
      replicas: 3
    restart: unless-stopped

  redis:                      # брокер + хранилище результатов
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
